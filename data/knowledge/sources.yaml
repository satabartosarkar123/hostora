# Live knowledge sources used to ground AI-proposed items (AGENTS.md section 23).
# Verify every endpoint, parameter and licence term at build time; fix them here, not in code.
version: 1

open_food_facts:
  taxonomy_url: "https://static.openfoodfacts.org/data/taxonomies/ingredients.json"
  product_search_url: "https://world.openfoodfacts.org/api/v2/search"
  product_url: "https://world.openfoodfacts.org/api/v2/product/{code}"
  user_agent: "Hostora/1.0 (non-commercial; contact in /privacy)"   # OFF asks for an identifying User-Agent
  refresh_days: 7
  licence: "ODbL; attribute Open Food Facts wherever its data is shown"

wikidata:
  sparql_url: "https://query.wikidata.org/sparql"
  user_agent: "Hostora/1.0 (non-commercial; contact in /privacy)"
  properties:
    made_from_material: P186
    has_part: P527
  label_languages: [en, hi, bn, ta, te, mr, gu, kn, ml, pa, ur]
  refresh_days: 30

web_grounding:
  # Search-grounded extraction: the model must return quotes with URLs; uncited claims are dropped.
  providers: [groq_browser_search, gemini_google_search]   # in order; verify availability and free limits
  max_sources_per_item: 3
  refresh_days: 30

store_products:
  swiggy_instamart_mcp: { enabled: false }   # turn on once Builders Club production access is granted

stores:
  swiggy:
    enabled: true
    mode: localhost   # localhost | production
    client_id: "swiggy-mcp"
    instamart_mcp_url: "https://mcp.swiggy.com/im"
    food_mcp_url: "https://mcp.swiggy.com/food"
    oauth_authorize_url: "https://mcp.swiggy.com/auth/authorize"
    oauth_token_url: "https://mcp.swiggy.com/auth/token"
    oauth_register_url: "https://mcp.swiggy.com/auth/register"
    checkout_instamart_url: "https://www.swiggy.com/instamart/checkout"
    checkout_food_url: "https://www.swiggy.com/checkout"
    capabilities:
      search_products: ["search_products", "instamart_search_products"]
      search_restaurants: ["search_restaurants", "search_menu", "search_dishes"]
      get_menu: ["get_restaurant_menu", "search_menu", "get_menu"]
      eta: ["get_addresses", "get_delivery_status", "get_food_delivery_status", "get_eta", "check_serviceability"]
      cart_add: ["update_cart", "update_food_cart", "add_to_cart", "update_instamart_cart"]
      cart_view: ["get_cart", "get_food_cart", "view_cart"]
      checkout_link: ["get_checkout_url", "checkout_link"]
      order_status: ["track_order", "track_food_order", "get_orders", "get_food_orders", "get_order_status"]
      forbidden_tools: ["checkout", "place_food_order", "confirm_order", "check_payment_status", "get_payment_options", "place_instamart_order", "place_order", "create_order", "pay_order", "confirm_payment"]
  zomato:
    enabled: false
    mode: localhost   # localhost | production (requires Zomato OAuth redirect allowlisting)
    client_id: "hostora-local"
    mcp_url: "https://mcp-server.zomato.com/mcp"
    oauth_authorize_url: "https://mcp-server.zomato.com/authorize"
    oauth_token_url: "https://mcp-server.zomato.com/token"
    oauth_register_url: "https://mcp-server.zomato.com/register"
    checkout_url: "https://www.zomato.com/checkout"
    capabilities:
      search_restaurants: ["get_restaurants_for_keyword", "search_restaurants"]
      get_menu: ["get_menu_items_listing", "get_restaurant_menu_by_categories"]
      eta: ["get_saved_addresses_for_user", "get_delivery_eta"]
      cart_add: ["create_cart", "add_to_cart"]
      cart_view: ["get_cart", "view_cart"]
      checkout_link: ["get_checkout_url", "checkout_cart"]
      order_status: ["get_order_tracking_info", "get_order_status"]
      forbidden_tools: ["place_order", "checkout_order", "make_payment", "submit_order"]

policy:
  quorum: 2                  # independent source families that must explain an item
  require_non_model: true    # at least one of them is not an AI model
  verifier_samples: 3        # independent verifier answers per item (agreement score)
  min_agreement: 0.67        # replaced by the calibrated value (hostora calibrate)
  alpha: 0.01                # target: at most 1% unsafe auto-approvals, with a conformal bound

osm:
  taginfo_url: "https://taginfo.openstreetmap.org/api/4/tag/stats"
  overpass_url: "https://overpass-api.de/api/interpreter"
  user_agent: "Hostora/1.0 (contact: info@hostora.internal; non-commercial venue planning)"
  cache_days: 7
  attribution: "© OpenStreetMap contributors"

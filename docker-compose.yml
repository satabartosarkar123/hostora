services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: hostora
      POSTGRES_PASSWORD: hostora
      POSTGRES_DB: hostora
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hostora"]
      interval: 2s
      retries: 20
volumes:
  pgdata:


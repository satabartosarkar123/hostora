name: e2e
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hostora
          POSTGRES_PASSWORD: hostora
          POSTGRES_DB: hostora_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hostora"
          --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      ENV: test
      DATABASE_URL: postgresql://hostora:hostora@localhost:5432/hostora
      TEST_DATABASE_URL: postgresql://hostora:hostora@localhost:5432/hostora_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-groups --frozen
      - run: DATABASE_URL=$TEST_DATABASE_URL uv run alembic upgrade head
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -m e2e
      - run: uv run python scripts/check_page_weight.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/

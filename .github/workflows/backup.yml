name: backup
on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    container:
      image: postgres:17
    steps:
      - name: Dump, compress and encrypt database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          pg_dump --no-owner --no-acl "$DATABASE_URL" | gzip -9 | \
            openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -pass env:BACKUP_PASSPHRASE -out hostora-backup.sql.gz.enc
      - uses: actions/upload-artifact@v7
        with:
          name: hostora-db-backup-${{ github.run_id }}
          path: hostora-backup.sql.gz.enc
          retention-days: 30

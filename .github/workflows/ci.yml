name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hostora
          POSTGRES_PASSWORD: hostora
          POSTGRES_DB: hostora_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hostora"
          --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      ENV: test
      DATABASE_URL: postgresql://hostora:hostora@localhost:5432/hostora
      TEST_DATABASE_URL: postgresql://hostora:hostora@localhost:5432/hostora_test
      SECRET_KEY: test-secret-key-48-chars-long-for-testing-purposes-only
      TOKEN_HMAC_SECRET: test-token-hmac-secret-48-chars-long-for-testing-only
      PHONE_ENC_KEY: c29tZS0zMi1ieXRlLXBob25lLWVuYy1rZXktYmFzZTY0
      STORE_TOKEN_KEY: c29tZS0zMi1ieXRlLXN0b3JlLXRva2VuLWtleS1iNjQ=
      PASS_SIGNING_KEY: 4ac86f0bfba2bce35f7642426a88e08e217debc55a896b7fe9ee01fe4fbcac29
      PASS_PUBLIC_KEY: 5efca91ba5777b9f3170caab26a9132d030535bc7347151005fe3299c48f23b5
      CRON_SECRET: test-cron-secret-32-chars-long-12345678
      DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-groups --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy
      - run: uv run hostora data-check
      - run: DATABASE_URL=$TEST_DATABASE_URL uv run alembic upgrade head && DATABASE_URL=$TEST_DATABASE_URL uv run alembic check
      - run: uv run pytest -m "not e2e and not llm_live" --cov --cov-report=xml --cov-report=term
      - run: uv run coverage report --fail-under=85
      - run: uv run coverage report --include='src/hostora/engine/*' --fail-under=95

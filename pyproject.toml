[project]
name = "hostora"
version = "0.1.0"
description = "Hostora: confirmed headcount in, a priced food and shopping plan out."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "pyjwt[crypto]>=2.10",
    "itsdangerous>=2.2",
    "cryptography>=43",
    "segno>=1.6",
    "pyyaml>=6.0",
    "structlog>=24.4",
    "typer>=0.13",
    "tzdata>=2024.2",
    "sentry-sdk[fastapi]>=2.18",
]

[project.scripts]
hostora = "hostora.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "hypothesis>=6.115",
    "respx>=0.21",
    "pytest-playwright>=0.6",
    "axe-playwright-python>=0.1.4",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "pre-commit>=4.0",
]
load = [
    "locust>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hostora"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["*.md"]  # AGENTS.md snippets are intentionally compact

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "PT"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S603"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["hostora"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["segno.*", "sse_starlette.*", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "db: needs TEST_DATABASE_URL (Postgres)",
    "e2e: browser tests against a live server",
    "llm_live: calls a real LLM API (skipped unless keys are set)",
    "knowledge_live: calls real knowledge APIs (OFF, Wikidata, Web)",
]

[tool.coverage.run]
source = ["hostora"]
branch = true
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
skip_covered = true
